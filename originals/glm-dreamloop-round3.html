    + '<div class="atis">' + icon('sun') + '&nbsp; WIND 4 KT · QNH 1013 · CLEAR · DAY 3</div>'
    + '<div class="stat-row"><div class="stat"><span class="lbl">' + icon('radar') + 'TRAFFIC</span><br><b id="twCount">0</b> &nbsp;<span class="stale hidden" id="twStale">· STALE</span></div>'
    + '<div class="stat"><span class="lbl">' + icon('globe') + 'FIELD</span><br><b>' + (a.kind === 'major' ? '2 RWY' : '1 RWY') + '</b></div></div>'
    + '<div class="sect">' + icon('chat') + '<span class="lbl">RECENT BROADCASTS</span></div>'
    + '<ul class="tx-list" id="twTx"></ul>'
    + '<div class="frow" id="twFrow">' + fbtnHtml(FAILURE_DEFS.slice(1, 3)) + '</div>';
  paneRefs = { kind: 'airport', ref: a, lastTx: -1, els: { status: $('twStatus'), count: $('twCount'), stale: $('twStale'), tx: $('twTx') } };
  $('twX').addEventListener('click', () => select(null));
  paneEl.querySelectorAll('[data-f]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.getAttribute('data-f');
      const healthy = key === 'radio' ? a.radioOK : a.radarOK;
      setTowerFailure(a, key, healthy);  /* healthy → engage failure; failed → restore */
      syncTowerButtons(a);
    });
  });
  syncTowerButtons(a);
  updatePane(true);
}
function syncTowerButtons(a) {
  paneEl.querySelectorAll('[data-f]').forEach(btn => {
    const key = btn.getAttribute('data-f');
    const failed = key === 'radio' ? !a.radioOK : !a.radarOK;
    btn.classList.toggle('on', failed);
  });
}

function updatePane(force) {
  if (!selection || !paneRefs) return;
  if (!paneRefs.els.status || !paneRefs.els.status.isConnected) return;
  if (paneRefs.kind === 'plane') {
    const p = paneRefs.ref;
    if (!p.alive) { select(null); return; }
    const e = paneRefs.els;
    const status = p.engaged ? 'ENGAGED' : (p.failures.engine ? 'MAYDAY' : p.phase === 'DWELL' ? 'GROUND' : p.phase);
    e.status.textContent = status;
    e.status.className = 'p-status ' + (p.engaged || p.failures.engine ? 'coral' : p.phase === 'DWELL' ? 'gray' : 'mint');
    e.fuelFill.style.width = Math.round(p.fuel * 100) + '%';
    e.fuelVal.textContent = Math.round(p.fuel * 100) + '%';
    const diff = Math.abs(p.fuelComputed - p.fuel);
    if (diff > 0.05 && p.failures.leak) {
      e.fuelSub.classList.remove('hidden');
      e.fuelSub.textContent = 'computed ' + Math.round(p.fuelComputed * 100) + '% · Δ ' + Math.round(diff * 100) + '%';
    } else e.fuelSub.classList.add('hidden');
    e.alt.textContent = fmtInt(p.altFt) + ' ft';
    e.spd.textContent = Math.round(p.kt) + ' kt';
    e.phase.textContent = 'PHASE ' + (p.failures.engine ? 'GLIDE' : p.phase);
    e.conf.textContent = 'CONF ' + p.confidence.toFixed(2);
    if (paneRefs.lastKnow !== p.knowStamp) {
      paneRefs.lastKnow = p.knowStamp;
      e.think.innerHTML = p.knowledge.map(k => '<li>' + esc(k) + '</li>').join('') || '<li>…</li>';
    }
    if (paneRefs.lastDec !== p.decStamp) {
      paneRefs.lastDec = p.decStamp;
      if (p.decisions && p.decisions.options && p.decisions.options.length) {
        e.decs.innerHTML = p.decisions.options.map((o, i) =>
          '<div class="dec"><span class="dl">' + esc(o.label) + '</span>'
          + '<div class="dtrack"><div class="dfill" style="width:' + Math.round(o.probability * 100) + '%;background:' + DEC_COLORS[i % DEC_COLORS.length] + '"></div></div>'
          + '<b class="dv">' + o.probability.toFixed(2) + '</b></div>'
        ).join('');
      } else {
        e.decs.innerHTML = '<div class="dec empty">AWAITING FIRST MIND CYCLE…</div>';
      }
    }
    e.anom.textContent = p.anomaly.toFixed(2);
    e.gauge.style.strokeDashoffset = (119.4 * (1 - clamp(p.anomaly, 0, 1))).toFixed(1);
    e.gauge.style.stroke = p.anomaly >= 0.45 ? 'var(--coral)' : 'var(--gold)';
  } else {
    const a = paneRefs.ref;
    const e = paneRefs.els;
    e.status.textContent = a.radioOK ? 'ON AIR' : 'SILENT';
    e.status.className = 'p-status ' + (a.radioOK ? 'mint' : 'coral');
    let count = 0;
    for (const p of W.planes) {
      if (p.alive && (p.group.position.distanceTo(a.pos) < TOWER_RANGE || (p.phase === 'DWELL' && (p.origin === a || p.dest === a)))) count++;
    }
    if (a.radarOK) { a.lastCount = count; e.stale.classList.add('hidden'); }
    else e.stale.classList.remove('hidden');
    e.count.innerHTML = a.lastCount + ' <span style="font-size:9px;color:var(--mut);letter-spacing:.1em">IN RANGE</span>';
    const stamp = a.broadcasts.map(b => b.t).join('|');
    if (paneRefs.lastTx !== stamp) {
      paneRefs.lastTx = stamp;
      e.tx.innerHTML = a.broadcasts.length
        ? a.broadcasts.map(b => '<li><b style="color:#fff">' + b.t + '</b> · ' + esc(b.message) + '</li>').join('')
        : '<li>listening…</li>';
    }
  }
}

/* ================================================================
   10 · INTERACTION (click select, drag rotate, wheel zoom)
================================================================ */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
let dragState = null;

const glEl = renderer.domElement;
glEl.addEventListener('pointerdown', e => {
  dragState = { x: e.clientX, y: e.clientY, az: cam.az, tilt: cam.tilt, moved: 0 };
  try { glEl.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
});
glEl.addEventListener('pointermove', e => {
  if (dragState) {
    const dx = e.clientX - dragState.x, dy = e.clientY - dragState.y;
    dragState.moved = Math.max(dragState.moved, Math.abs(dx) + Math.abs(dy));
    if (dragState.moved > 5) document.body.classList.add('dragging');
    cam.az = dragState.az - dx * 0.0045;
    cam.tilt = clamp(dragState.tilt + dy * 0.003, 32 * Math.PI / 180, 62 * Math.PI / 180);
  }
});
glEl.addEventListener('pointerup', e => {
  const wasClick = dragState && dragState.moved < 6;
  dragState = null;
  document.body.classList.remove('dragging');
  if (wasClick) doPick(e.clientX, e.clientY);
});
glEl.addEventListener('wheel', e => {
  e.preventDefault();
  cam.distT = clamp(cam.distT * (1 + e.deltaY * 0.0009), 86, 305);
}, { passive: false });

function doPick(cx, cy) {
  if (!W) return;
  pointerNDC.set((cx / window.innerWidth) * 2 - 1, -(cy / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObjects(W.pickables, false);
  if (hits.length && hits[0].object.userData.pick) {
    const pk = hits[0].object.userData.pick;
    select({ kind: pk.kind, ref: pk.ref });
  } else {
    select(null);
  }
}

/* hover cursor (throttled) */
let hoverFrame = 0;
glEl.addEventListener('pointermove', e => {
  if (dragState || (hoverFrame++ % 4)) return;
  if (!W) return;
  pointerNDC.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObjects(W.pickables, false);
  glEl.style.cursor = hits.length ? 'pointer' : 'grab';
});

/* ================================================================
   11 · UI BINDINGS
================================================================ */
function updateChips() {
  if (!W) return;
  $('cMajor').textContent = W.airports.filter(a => a.kind === 'major').length;
  $('cSmall').textContent = W.airports.filter(a => a.kind === 'small').length;
}
$('chipMinds').textContent = Mind.mode() + ' MINDS';

$('diceBtn').addEventListener('click', () => {
  const b = $('diceBtn');
  b.classList.remove('spin'); void b.offsetWidth; b.classList.add('spin');
  const seed = 1000 + (Math.random() * 8999 | 0);
  buildWorld(seed);
  log('system', 'SPIRITS', 'world regenerated · seed ' + seed);
});
document.querySelectorAll('.szword').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.szword').forEach(p => p.classList.remove('on'));
    pill.classList.add('on');
    worldSize = pill.getAttribute('data-size');
    const seed = 1000 + (Math.random() * 8999 | 0);
    buildWorld(seed);
    log('system', 'SPIRITS', 'map size ' + worldSize + ' · seed ' + seed);
  });
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ================================================================
   12 · LABELS & FX PROJECTION
================================================================ */
const _v = new THREE.Vector3();
const _dir = new THREE.Vector3();
const _camPos = new THREE.Vector3();
function placeLabel(el, anchor) {
  camera.getWorldDirection(_dir);
  _camPos.copy(camera.position);
  _v.copy(anchor).sub(_camPos);
  if (_v.dot(_dir) <= 0.5) { el.style.visibility = 'hidden'; return; }
  _v.copy(anchor).project(camera);
  const x = (_v.x * 0.5 + 0.5) * window.innerWidth;
  const y = (-_v.y * 0.5 + 0.5) * window.innerHeight;
  if (x < -80 || x > window.innerWidth + 80 || y < -60 || y > window.innerHeight + 60) { el.style.visibility = 'hidden'; return; }
  el.style.visibility = 'visible';
  el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) translate(-50%,-130%)';
}
function updateLabels() {
  if (!W) return;
  for (const a of W.airports) placeLabel(a.labelEl, a.labelAnchor);
  for (const p of W.planes) {
    if (!p.alive) { p.tagEl.style.visibility = 'hidden'; continue; }
    _v.copy(p.group.position); _v.y += p.phase === 'DWELL' ? 1.2 : 1.7;
    placeLabel(p.tagEl, _v);
    p.tagEl.classList.toggle('hot', p.engaged);
    p.tagEl.classList.toggle('sel', selection && selection.ref === p);
  }
}
function updateSelectionFx(dt) {
  if (selection && W) {
    const pos = selection.kind === 'plane' ? selection.ref.group.position : selection.ref.pos;
    if (selection.kind === 'plane' && !selection.ref.alive) { selRing.visible = selGlow.visible = false; return; }
    const gy = groundYAt(pos.x, pos.z);
    selRing.visible = selGlow.visible = true;
    selRing.position.set(pos.x, gy + 0.16, pos.z);
    selGlow.position.set(pos.x, gy + 0.12, pos.z);
    selRing.rotation.y += dt * 0.4;
  } else {
    selRing.visible = selGlow.visible = false;
  }
}

/* ================================================================
   13 · MAIN LOOP
================================================================ */
const startClock = 18 * 3600 + 24 * 60 + 10;
let simSec = 0, elapsedGlobal = 0, last = performance.now(), uiAcc = 0, chipAcc = 0;

function updateCamera(dt) {
  cam.dist += (cam.distT - cam.dist) * Math.min(1, dt * 5);
  const ch = Math.cos(cam.tilt) * cam.dist;
  const cy = Math.sin(cam.tilt) * cam.dist;
  camera.position.set(Math.sin(cam.az) * ch, cy, Math.cos(cam.az) * ch);
  camera.lookAt(0, 0.5, -6);
  scene.fog.near = cam.dist + 34;
  scene.fog.far = cam.dist + 250;
}

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t = now / 1000;
  elapsedGlobal += dt;
  simSec += dt * 6;

  updateCamera(dt);
  if (W) {
    for (const p of W.planes) updatePlane(p, dt, t, elapsedGlobal);
    for (const b of W.boats) {
      b.ang += b.sp * dt;
      const x = b.ax + Math.cos(b.ang) * b.rad, z = b.az + Math.sin(b.ang) * b.rad;
      b.g.position.set(x, 0.12 + Math.sin(t * 1.4 + b.ph) * 0.05, z);
      b.g.rotation.y = -b.ang + (b.sp > 0 ? 0 : Math.PI);
      b.g.rotation.z = Math.sin(t * 1.1 + b.ph) * 0.05;
    }
    for (const w of W.waves) w.m.material.opacity = 0.22 + Math.sin(t * 0.9 + w.ph) * 0.12;
    for (const f of W.foams) {
      const s = 1 + Math.sin(t * 1.2 + f.ph) * 0.03;
      f.m.scale.set(s, s, 1);
    }
    for (const c of W.clouds) {
      c.ang += c.sp * dt;
      c.g.position.x = Math.cos(c.ang) * c.r;
      c.g.position.z = Math.sin(c.ang) * c.r;
    }
  }
  causticTex.offset.x = (t * 0.006) % 1;
  causticTex.offset.y = (t * 0.004) % 1;
  if (W && W.shimmer) {
    W.shimmer.rotation.y = t * 0.008;
    shimmerMat.opacity = 0.2 + 0.15 * (0.5 + 0.5 * Math.sin(t * 1.7));
  }
  updateLabels();
  updateSelectionFx(dt);

  /* heartbeat cadence ~10 s; chatter on its own clock */
  hbAcc += dt;
  if (hbAcc >= 10) { hbAcc = 0; runHeartbeats(); }
  chatterAcc += dt;
  if (chatterAcc >= 13) { chatterAcc = 0; ambientChatter(); }

  uiAcc += dt;
  if (uiAcc >= 0.2) { uiAcc = 0; updatePane(false); }
  chipAcc += dt;
  if (chipAcc >= 1) { chipAcc = 0; updateChips(); }

  $('clockTime').textContent = clockStr();
  renderer.render(scene, camera);
}

/* ================================================================
   14 · BOOT
================================================================ */
buildWorld(1000 + (Math.random() * 8999 | 0));
{
  /* opening flavor: a Cessna gets into trouble so the log & pane feel alive */
  setTimeout(() => {
    if (!W) return;
    const p = W.planes.find(x => x.callsign === 'N42') || W.planes.find(x => x.kind === 'cessna');
    if (p && p.alive) {
      select({ kind: 'plane', ref: p });
      beginEngineFailure(p, 'engine failure');
    }
  }, 1600);
  /* a nearby airliner reacts and diverts, landing a decision line in the strip */
  setTimeout(() => {
    if (!W) return;
    const ab = W.planes.find(x => x.callsign === 'AB123' && x.alive && x.phase !== 'DWELL');
    if (!ab) return;
    const tgt = W.airports.filter(a => a.kind === 'major' && a !== ab.dest && a !== ab.origin);
    if (tgt.length) divert(ab, tgt[0], 0.58);
  }, 9000);
}
requestAnimationFrame(animate);
</script>
